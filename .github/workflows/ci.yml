name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep Bevy's native dependency builds within hosted-runner disk capacity.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native:
    name: Native checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install the repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Build native game
        run: cargo build --locked --workspace

  web:
    name: WebAssembly release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository Rust toolchain and web target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install matching WebAssembly bindings tool
        run: |
          wasm_bindgen_version=$(python3 - <<'PY'
          import tomllib
          with open("Cargo.lock", "rb") as lockfile:
              packages = tomllib.load(lockfile)["package"]
          versions = {package["version"] for package in packages if package["name"] == "wasm-bindgen"}
          if len(versions) != 1:
              raise SystemExit("Expected exactly one wasm-bindgen version in Cargo.lock")
          print(versions.pop())
          PY
          )
          cargo install wasm-bindgen-cli --version "=$wasm_bindgen_version" --locked

      - name: Build web game
        run: cargo build --locked --release --target wasm32-unknown-unknown -p game

      - name: Package website
        run: |
          mkdir -p dist
          wasm-bindgen --target web --out-dir dist --out-name game \
            target/wasm32-unknown-unknown/release/game.wasm
          cp -R web/. dist/
          printf '%s\n' "$GITHUB_SHA" > dist/revision.txt
          test -s dist/index.html
          test -s dist/game.js
          test -s dist/game_bg.wasm

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy and verify GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify the deployed revision and game files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Allow the Pages CDN up to two minutes of retry delays to publish this commit.
          for attempt in {1..20}; do
            deployed_revision=$(curl --fail --silent --show-error --max-time 15 \
              "${PAGE_URL%/}/revision.txt?revision=$GITHUB_SHA") || deployed_revision=""
            if [ "$deployed_revision" = "$GITHUB_SHA" ]; then
              for file in index.html game.js game_bg.wasm; do
                curl --fail --silent --show-error --head --max-time 30 \
                  "${PAGE_URL%/}/$file?revision=$GITHUB_SHA" > /dev/null
              done
              exit 0
            fi
            echo "Waiting for Pages revision (attempt $attempt/20)"
            sleep 6
          done
          echo "The live Pages revision did not match $GITHUB_SHA" >&2
          exit 1
